<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Running Lover</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0d0d0d;
      color:white;
      text-align:center;
    }

    .hero{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      padding:20px;
      background:linear-gradient(to bottom,#111,#1a1a1a);
    }

    .logo{
      font-size:52px;
      font-weight:bold;
      color:#ff2020;
      margin-bottom:10px;
    }

    .subtitle{
      font-size:18px;
      color:#cccccc;
      margin-bottom:30px;
      line-height:1.6;
    }

    .btn{
      display:inline-block;
      padding:14px 28px;
      margin:10px;
      border-radius:12px;
      text-decoration:none;
      font-size:18px;
      font-weight:bold;
      transition:0.3s;
    }

    .btn-red{
      background:#ff2020;
      color:white;
    }

    .btn-dark{
      border:2px solid #ff2020;
      color:#ff2020;
    }

    .btn:hover{
      transform:scale(1.05);
    }

    .stats{
      display:flex;
      justify-content:center;
      gap:20px;
      margin-top:40px;
      flex-wrap:wrap;
    }

    .card{
      background:#1a1a1a;
      padding:20px;
      border-radius:18px;
      width:140px;
      box-shadow:0 0 15px rgba(255,0,0,0.2);
    }

    .card h2{
      color:#ff2020;
      margin-bottom:10px;
    }

    footer{
      padding:20px;
      color:#777;
      font-size:14px;
    }

    @media(max-width:600px){
      .logo{
        font-size:42px;
      }

      .subtitle{
        font-size:16px;
      }

      .btn{
        width:90%;
      }
    }
  </style>
</head>

<body>

<section class="hero">

  <div class="logo">RL</div>

  <p class="subtitle">
    Run Beyond Limits 🏃🔥<br>
    Trail • Running • Motivation
  </p>

  <a href="#" class="btn btn-red">Instagram</a>
  <a href="#" class="btn btn-dark">TikTok</a>

  <div class="stats">

    <div class="card">
      <h2>10K</h2>
      <p>Objectif</p>
    </div>

    <div class="card">
      <h2>Trail</h2>
      <p>Passion</p>
    </div>

    <div class="card">
      <h2>RL</h2>
      <p>Community</p>
    </div>

  </div>

</section>

<footer>
  © Running Lover
</footer>

</body>
</html>
